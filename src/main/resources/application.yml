spring:
  application:
    name: gamevault

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/gamevault
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  http:
    clients:
      connect-timeout: 3s
      read-timeout: 10s

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

rawg:
  base-url: https://api.rawg.io/api
  api-key: ${RAWG_API_KEY:}

gamevault:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

  profile-image:
    directory: ${GAMEVAULT_PROFILE_IMAGE_DIRECTORY:./data/profile-images}
