services:
  mysql:
    image: mysql:8.4
    container_name: gamevault-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gamevault
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - gamevault_mysql_data:/var/lib/mysql

volumes:
  gamevault_mysql_data: